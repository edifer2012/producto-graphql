name: Quality and integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: productos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_user -d productos_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/productos_test
      TEST_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/productos_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test
        working-directory: frontend

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: productos
      POSTGRES_USER: productos_app
      POSTGRES_PASSWORD: ci-app-password
      POSTGRES_ADMIN_PASSWORD: ci-admin-password
      WEB_BIND: 127.0.0.1
      WEB_PORT: '8080'
      GRAPHQL_IDE: 'false'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:8080/healthz
      - run: python3 scripts/smoke.py http://127.0.0.1:8080/graphql
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
